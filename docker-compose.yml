services:
  strava-exporter-api:
    build:
      context: ./backend
      dockerfile: src/StravaExporter.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Strava__ClientId: ${STRAVA_CLIENT_ID}
      Strava__ClientSecret: ${STRAVA_CLIENT_SECRET}
      Strava__RedirectUri: http://localhost:5080/api/strava/callback
      Frontend__Origin: http://localhost:5173
      Frontend__RedirectAfterConnect: http://localhost:5173/connected
      ConnectionStrings__AppDb: Data Source=/data/strava-exporter.db
    volumes:
      - strava-exporter-data:/data

  strava-exporter-web:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5080
    depends_on:
      - strava-exporter-api

volumes:
  strava-exporter-data:
